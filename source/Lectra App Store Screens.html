<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; background: #000; }
  .ab { position: relative; overflow: hidden; }
  .ab > .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* iPad in landscape: bezel, then a 4:3 screen */
  .ipad { position: absolute; box-sizing: border-box; background: #0B0908;
          box-shadow: 0 0 0 4px #3A322B, 0 60px 180px rgba(0,0,0,0.6); }
  .ipad img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: top left; }
  .side img { filter: brightness(0.82); }
</style></head>
<body>
<!-- Header 21:9 -->
<div id="header" class="ab" style="width:3840px;height:1646px">

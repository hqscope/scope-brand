<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..800&amp;family=Spline+Sans+Mono:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..800;1,6..72,300..800&amp;family=Young+Serif&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Scope Stack';src:url('fonts/ScopeStack-Regular.ttf') format('truetype');font-display:block;}
body{margin:0;background:#EFEAE1;}
a{color:#C42B26;text-decoration:none;} a:hover{color:#241E18;}
</style>
</helmet>
<section id="turn-5" style="display:flex;flex-direction:column;gap:48px;padding:120px 120px 40px;width:3480px;box-sizing:border-box;font-family:'Schibsted Grotesk',sans-serif;color:#F6F1E7">
  <div style="display:flex;flex-direction:column;gap:12px;max-width:1500px">
    <span style="font-family:'Spline Sans Mono',monospace;font-size:20px;color:#6B5F55">Turn 5 · final</span>
    <div style="font-size:64px;font-weight:700;letter-spacing:-0.03em;line-height:1;color:#241E18">The pair: light and dark.</div>
    <div style="font-size:24px;line-height:1.45;color:#6B5F55">Light (5a) and dark (5b). 1584 × 396.</div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:72px 64px">

    <div id="5a" style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:14px"><span style="font-family:'Spline Sans Mono',monospace;font-size:16px;font-weight:600;background:#241E18;color:#F6F1E7;border-radius:999px;padding:4px 12px">5a</span><span style="font-size:20px;font-weight:600;color:#241E18">Light · haze</span><span style="font-family:'Spline Sans Mono',monospace;font-size:16px;color:#6B5F55">1584 × 396</span></div>
      <div style="position:relative;width:1584px;height:396px;overflow:hidden;background:oklch(0.9 0.045 40);flex:none">
        <div style="position:absolute;inset:-90px;filter:blur(48px)"><div style="position:absolute;left:-60px;top:250px;width:760px;height:220px;border-radius:999px;background:#E5484D"></div><div style="position:absolute;left:40px;top:40px;width:420px;height:150px;border-radius:999px;background:oklch(0.78 0.09 255)"></div><div style="position:absolute;left:1040px;top:20px;width:820px;height:210px;border-radius:999px;background:oklch(0.72 0.17 35)"></div><div style="position:absolute;left:1260px;top:330px;width:560px;height:200px;border-radius:999px;background:oklch(0.84 0.12 80)"></div><div style="position:absolute;left:502px;top:138px;width:760px;height:300px;border-radius:999px;background:#F6F1E7"></div><div style="position:absolute;left:880px;top:440px;width:520px;height:150px;border-radius:999px;background:oklch(0.66 0.19 18)"></div></div>
        <div style="position:absolute;inset:0;background-image:url('assets/texture/grain.svg');opacity:0.5"></div>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px"><div style="display:flex;align-items:baseline;font-size:102px;line-height:1;color:#14100C;white-space:nowrap"><span style="font-family:'Newsreader',serif;font-style:italic;font-weight:400;letter-spacing:-0.02em">Study with</span><img src="assets/logo/scope-mark.svg" alt="" style="height:0.7em;margin:0 0.24em 0 0.32em"><span style="font-weight:700;letter-spacing:-0.03em">Scope</span></div><div style="font-size:30px;font-weight:500;letter-spacing:-0.01em;color:#241E18">Free study tools for every student.</div></div>
        <div style="position:absolute;right:40px;bottom:30px;font-family:'Spline Sans Mono',monospace;font-size:20px;color:#14100C">canvascope.org</div>
        <sc-if value="{{ showSafe }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:48px;top:200px;width:320px;height:320px;border-radius:50%;border:3px dashed #14100C;background:rgba(20,16,12,0.12);box-sizing:border-box"></div></sc-if>
      </div>
    </div>

    <div id="5b" style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;gap:14px"><span style="font-family:'Spline Sans Mono',monospace;font-size:16px;font-weight:600;background:#241E18;color:#F6F1E7;border-radius:999px;padding:4px 12px">5b</span><span style="font-size:20px;font-weight:600;color:#241E18">Dark · night haze</span><span style="font-family:'Spline Sans Mono',monospace;font-size:16px;color:#6B5F55">1584 × 396</span></div>
      <div style="position:relative;width:1584px;height:396px;overflow:hidden;background:#14100C;flex:none">
        <div style="position:absolute;inset:-90px;filter:blur(58px)"><div style="position:absolute;left:-40px;top:270px;width:720px;height:220px;border-radius:999px;background:#E5484D"></div><div style="position:absolute;left:60px;top:10px;width:440px;height:150px;border-radius:999px;background:oklch(0.5 0.1 255)"></div><div style="position:absolute;left:1100px;top:-10px;width:780px;height:210px;border-radius:999px;background:oklch(0.6 0.17 35)"></div><div style="position:absolute;left:1300px;top:350px;width:520px;height:190px;border-radius:999px;background:oklch(0.68 0.13 70)"></div><div style="position:absolute;left:820px;top:440px;width:560px;height:150px;border-radius:999px;background:oklch(0.55 0.19 18)"></div></div>
        <div style="position:absolute;inset:0;background-image:url('assets/texture/grain-light.svg');opacity:0.3"></div>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px"><div style="display:flex;align-items:baseline;font-size:102px;line-height:1;color:#F6F1E7;white-space:nowrap"><span style="font-family:'Newsreader',serif;font-style:italic;font-weight:400;letter-spacing:-0.02em">Study with</span><img src="assets/logo/scope-mark-reverse.svg" alt="" style="height:0.7em;margin:0 0.24em 0 0.32em"><span style="font-weight:700;letter-spacing:-0.03em">Scope</span></div><div style="font-size:30px;font-weight:500;letter-spacing:-0.01em;color:#F6F1E7">Free study tools for every student.</div></div>
        <div style="position:absolute;right:40px;bottom:30px;font-family:'Spline Sans Mono',monospace;font-size:20px;color:#F6F1E7">canvascope.org</div>
        <sc-if value="{{ showSafe }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:48px;top:200px;width:320px;height:320px;border-radius:50%;border:3px dashed #F6F1E7;background:rgba(246,241,231,0.12);box-sizing:border-box"></div></sc-if>
      </div>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showSafeZones&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Preview&quot;},&quot;grain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Texture&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showSafe: !!this.props.showSafeZones,
      grain: this.props.grain ?? true,
    };
  }
}
</script>
</body>
</html>
